events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 10M;

    # DNS interno do Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Log format para Cloudflare
    log_format main '$http_cf_connecting_ip - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ============================================================
    # MUNDO MÁGICO — API
    # ============================================================
    server {
        listen 80;
        server_name api.mundomagicocajamar.com.br;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream api:3333;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================
    # TIPMASTERS — www → non-www
    # ============================================================
    server {
        listen 80;
        server_name www.tipmasters.com.br;
        return 301 http://tipmasters.com.br$request_uri;
    }

    # ============================================================
    # TIPMASTERS — Site principal
    # ============================================================
    server {
        listen 80;
        server_name tipmasters.com.br;

        client_max_body_size 10M;

        # CSP permissivo (Cloudflare + Google Fonts)
        add_header Content-Security-Policy "default-src 'self' https://static.cloudflareinsights.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # NextAuth — rotas /api/auth/* vão pro Next.js (web)
        location /api/auth/ {
            set $upstream_web tipmasters-web:4010;
            proxy_pass http://$upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Arquivos estáticos Next.js
        location /_next/static/ {
            set $upstream_web tipmasters-web:4010;
            proxy_pass http://$upstream_web;
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_set_header Host $host;
        }

        # API — resto do /api/ vai pro backend
        location /api/ {
            set $upstream_api tipmasters-api:3011;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_cache_bypass $http_upgrade;
        }

        # WebSocket / Socket.io
        location /socket.io/ {
            set $upstream_api tipmasters-api:3011;
            proxy_pass         http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $http_cf_connecting_ip;
            proxy_read_timeout 86400s;
        }

        # Frontend (Next.js)
        location / {
            set $upstream_web tipmasters-web:4010;
            proxy_pass         http://$upstream_web;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }

    # ============================================================
    # TIPMASTERS — API (api-tipmasters.com)
    # ============================================================
    server {
        listen 80;
        server_name api-tipmasters.com www.api-tipmasters.com;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        client_max_body_size 10M;

        # WebSocket
        location /socket.io/ {
            set $upstream_api tipmasters-api:3011;
            proxy_pass         http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $http_cf_connecting_ip;
            proxy_read_timeout 86400s;
        }

        # API
        location / {
            set $upstream_api tipmasters-api:3011;
            proxy_pass         http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    # ============================================================
    # DEFAULT / CATCH-ALL
    # ============================================================
    server {
        listen 80 default_server;
        server_name _;
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
        location / {
            return 404;
        }
    }
}
