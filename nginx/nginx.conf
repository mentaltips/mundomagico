events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 10M;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Log format para Cloudflare (pegar IP real)
    log_format main '$http_cf_connecting_ip - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # Configuração para API
    server {
        listen 80;
        server_name api.mundomagicocajamar.com.br;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api:3333;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Real IP do Cloudflare
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Admin e Web estão na Vercel — Cloudflare aponta diretamente para Vercel.
    # O nginx da VPS NÃO precisa gerenciar esses domínios.
    # Este bloco só existe para retornar 200 caso o domínio caia aqui por engano.
    server {
        listen 80 default_server;
        server_name _;
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
        location / {
            return 404;
        }
    }
}
