events {
    worker_connections 1024;
}

http {
    # ─── Configurações gerais ─────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logs ──────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ─── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─── Rate Limiting ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ─── Redirect HTTP → HTTPS ────────────────────────────────────
    server {
        listen 80;
        server_name api.mundomagicocajamar.com;

        # Para renovação Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── API HTTPS ────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.mundomagicocajamar.com;

        ssl_certificate /etc/letsencrypt/live/api.mundomagicocajamar.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mundomagicocajamar.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        # ─── Headers de segurança ──────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ─── CORS para Vercel ─────────────────────────────────────
        add_header 'Access-Control-Allow-Origin' 'https://mundomagicocajamar.com' 'https://admin.mundomagicocajamar.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        location / {
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api:3333;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90;
        }
    }
}
