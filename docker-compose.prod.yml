services:
  # ─── Banco de Dados ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # SEGURANÇA: porta 5432 NÃO exposta externamente.
    # Acesso apenas pela rede interna Docker (serviço 'api').
    # Para conectar via psql localmente: docker exec -it <container> psql -U $POSTGRES_USER $POSTGRES_DB

  # ─── Cache / Filas ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - internal

  # ─── API (Express + Prisma) ───────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: 3333
      API_PORT: 3333
      API_BASE_URL: https://api.mundomagicocajamar.com.br
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
      - public
    ports:
      - "3333:3333"
    volumes:
      - ./uploads:/app/uploads
      - ./whatsapp-auth:/app/whatsapp-auth

  # ─── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - public

  # ─── Backup automático do banco ───────────────────────────────
  backup:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backups:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    # Roda pg_dump todo dia às 03:00 e mantém os últimos N dias
    entrypoint: >
      /bin/sh -c '
        echo "🔒 Serviço de backup iniciado. Próximo backup às 03:00.";
        while true; do
          NEXT=$$(date -d "tomorrow 03:00" +%s 2>/dev/null || date -v+1d -v3H -v0M -v0S +%s);
          NOW=$$(date +%s);
          SLEEP_SEC=$$((NEXT - NOW));
          echo "[Backup] Aguardando $${SLEEP_SEC}s até 03:00...";
          sleep $$SLEEP_SEC;
          DATE=$$(date +"%Y-%m-%d_%H-%M-%S");
          FILE="/backups/backup_$${DATE}.sql.gz";
          echo "[Backup $$(date)] ▶ Iniciando...";
          PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB | gzip > $$FILE;
          SIZE=$$(du -sh $$FILE | cut -f1);
          echo "[Backup $$(date)] ✅ Salvo: backup_$${DATE}.sql.gz ($$SIZE)";
          find /backups -name "backup_*.sql.gz" -mtime +$${RETENTION_DAYS} -delete;
          echo "[Backup $$(date)] 🗑️  Backups antigos removidos (retenção: $${RETENTION_DAYS} dias)";
        done
      '

  # ─── SSL (Let's Encrypt) ──────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  pgdata:
  redisdata:
  certbot-www:
  certbot-certs:
  backups:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
